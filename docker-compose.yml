# bf-agent + Ollama. From the repo root:
#   docker compose up --build
#   docker compose exec ollama ollama pull llama3.2
# GPU:  docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
# Host Ollama already running:  docker compose -f docker-compose.host-ollama.yml up --build
#
# Test output: ../halo-agent-benchmark is bind-mounted at /halo-agent-benchmark.

name: halo-agent

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["pull"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["/bin/ollama"]
    command: ["pull", "${HALO_PULL_MODEL:-llama3.2}"]

  bf-agent:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "${HALO_PORT:-11435}:11435"
    volumes:
      - ${HALO_WORKSPACE:-./workspace}:/workspace
      - ${HALO_BENCHMARK_ROOT:-../halo-agent-benchmark}:/halo-agent-benchmark
    environment:
      HALO_MODEL: ${HALO_MODEL:-auto}
      HALO_PORT: ${HALO_PORT:-11435}
      HALO_NUM_CTX: ${HALO_NUM_CTX:-16384}
      HALO_OLLAMA_URL: http://ollama:11434
      HALO_CWD: /workspace
      HALO_BENCHMARK_ROOT: /halo-agent-benchmark
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:11435/v1/models').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

volumes:
  ollama-data:
